version: '3.8'

services:
  # 1. Product Demand Prediction FastAPI Web Application
  demand-forecast-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: demand-forecast-app
    ports:
      - "8000:8000"
    environment:
      - CLOUD_PROVIDER=AWS_FREE_TIER
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=demand-forecasting-sales-data
      - DYNAMODB_TABLE_NAME=ProductDemandForecasts
    volumes:
      - ../data:/app/data

  # 2. LocalStack (Offline AWS Cloud Simulation with Zero Account / Subscription)
  localstack:
    image: localstack/localstack:latest
    container_name: demand-forecast-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb
      - DEFAULT_REGION=us-east-1
